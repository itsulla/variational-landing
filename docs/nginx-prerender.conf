# Build-time prerendered React SPA — nginx server fragment
#
# `npm run build` renders every public route to dist/<route>/index.html.
# Serve those documents to browsers and crawlers alike; no user-agent
# sniffing or third-party Prerender.io token is required.

# Merge this fragment into the existing HTTPS `server` block. It deliberately
# does not declare `listen`, `server_name`, certificates, or redirects: do not
# replace a production TLS vhost with this file. Adjust the root placeholder.
root /path/to/variational-landing/dist;
index index.html;

location /api/ {
    proxy_pass http://127.0.0.1:8002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 35s;
}

location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Prefer build-time route snapshots. The final fallback keeps client-side
# navigation and unknown legacy campaign URLs compatible with the SPA.
location / {
    try_files $uri $uri/index.html /index.html;
    add_header Cache-Control "no-cache" always;
}

