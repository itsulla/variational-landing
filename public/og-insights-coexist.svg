  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="100" y="130" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#60a5fa" letter-spacing="3">INSIGHTS · CATEGORY ANALYSIS</text>
